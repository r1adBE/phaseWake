# Vorschläge für Updates als Pull Requests (nur Hinweise; gemergt wird nach grüner CI von Hand).
# Je Ökosystem eine Gruppe: ein PR pro Woche statt mehrerer gleichzeitiger, die sich in der CI stauen.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      alle:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      alle:
        patterns: ["*"]
  # Werkzeuge der Workflows «Feiertage» und «Einschlafklänge» (feste Versionen mit Prüfsummen).
  - package-ecosystem: pip
    directory: /.github/scripts
    schedule:
      interval: weekly
    groups:
      alle:
        patterns: ["*"]

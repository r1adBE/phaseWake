name: Bildschirmfotos

# Rendert alle Vorschauen (Handy hell/dunkel, Uhr) und legt die Bilder in den Zweig «screenshots».
on:
  push:
    branches: [main]
    paths: [android/**, .github/workflows/screenshots.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Rendern
        shell: bash
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --stacktrace :app:updateDebugScreenshotTest :wear:updateDebugScreenshotTest 2>&1 | tee build.log
      - name: Fehler als Annotation
        if: failure()
        shell: bash
        working-directory: android
        run: ../.github/scripts/annotate-errors.sh build.log
      - name: In den Zweig «screenshots» legen
        shell: bash
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          for m in app wear; do
            mkdir -p "$out/$m"
            find "android/$m/src/screenshotTestDebug/reference" -name '*.png' -exec cp {} "$out/$m/" \;
          done
          {
            echo "# Phase Wake – Bildschirmfotos"
            echo
            echo "Automatisch aus dem Stand \`${GITHUB_SHA::7}\` gerendert. Beispieldaten, keine echten Nächte."
            for m in app wear; do
              echo
              [ "$m" = app ] && echo "## Handy" || echo "## Uhr"
              echo
              for f in $(ls "$out/$m" | sort); do
                echo "### ${f%.png}"
                echo
                echo "<img src=\"$m/$f\" width=\"320\">"
                echo
              done
            done
          } > "$out/README.md"
          cd "$out"
          git init -q -b screenshots
          git config user.name "r1AD"
          git config user.email "r1adBE@users.noreply.github.com"
          git add -A
          git commit -qm "Bildschirmfotos für ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots

name: Bildschirmfotos

# Rendert alle Vorschauen (Handy hell/dunkel, Uhr) und legt die Bilder in den Zweig «screenshots».
# Zwei Jobs (wie «Einschlafklänge»): «render» führt Gradle nur mit Leserecht und ohne
# gespeichertes Token aus, «publish» schreibt den Zweig und führt keinen Code aus dem Repo aus.
on:
  push:
    branches: [main]
    paths: [android/**, .github/workflows/screenshots.yml, .github/screenshots/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Rendern
        shell: bash
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --stacktrace :app:updateDebugScreenshotTest :wear:updateDebugScreenshotTest 2>&1 | tee build.log
      - name: Fehler als Annotation
        if: failure()
        shell: bash
        working-directory: android
        run: |
          ../.github/scripts/annotate-errors.sh build.log
          # Ursache gescheiterter Vorschauen (steht nur in den Testberichten, nicht im Log).
          causes=$(find . -path '*test-results*' -name '*.xml' -exec grep -h -A25 '<failure' {} + 2>/dev/null \
            | grep -E 'failure message|Exception|Caused by|at com\.phasewake' | head -40 || true)
          if [ -n "$causes" ]; then
            echo "::error title=Vorschau-Fehler::$(printf '%s' "$causes" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"
          fi
      - name: Bilder zusammenstellen
        shell: bash
        run: |
          set -euo pipefail
          out=shots
          for m in app wear; do
            mkdir -p "$out/$m"
            # Feste Dateinamen (ohne Prüfsummen-Anhang), damit Links im README stabil bleiben.
            find "android/$m/src/screenshotTestDebug/reference" -name '*.png' -print0 |
              while IFS= read -r -d '' f; do b=$(basename "$f"); cp "$f" "$out/$m/${b%%_*}.png"; done
          done
          sed "s/@SHA@/${GITHUB_SHA::7}/" .github/screenshots/README.md > "$out/README.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: shots/
          retention-days: 1
          if-no-files-found: error
      # Referenzbilder, wie die CI sie rendert: Sie werden ins Repo übernommen, und die CI prüft gegen sie.
      # Lokal gerenderte Bilder weichen in der Kantenglättung ab und eignen sich darum nicht als Referenz.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: referenzbilder
          path: |
            android/app/src/screenshotTestDebug/reference/
            android/wear/src/screenshotTestDebug/reference/
          retention-days: 3
          if-no-files-found: error

  publish:
    name: In den Zweig «screenshots» legen
    needs: render
    # Nur main: Ein Lauf auf einem Arbeitszweig liefert nur das Artefakt «referenzbilder».
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Kein Checkout: nur die Bilder aus «render».
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
      - name: Zweig schreiben
        shell: bash
        working-directory: ${{ runner.temp }}/shots
        run: |
          set -euo pipefail
          git init -q -b screenshots
          git config user.name "r1AD"
          git config user.email "r1adBE@users.noreply.github.com"
          git add -A
          git commit -qm "Bildschirmfotos für ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots

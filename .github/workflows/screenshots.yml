name: Bildschirmfotos

# Rendert alle Vorschauen (Handy hell/dunkel, Uhr) und legt die Bilder in den Zweig «screenshots».
on:
  push:
    branches: [main]
    paths: [android/**, .github/workflows/screenshots.yml, .github/screenshots/**]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Rendern
        shell: bash
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --stacktrace :app:updateDebugScreenshotTest :wear:updateDebugScreenshotTest 2>&1 | tee build.log
      - name: Fehler als Annotation
        if: failure()
        shell: bash
        working-directory: android
        run: |
          ../.github/scripts/annotate-errors.sh build.log
          # Ursache gescheiterter Vorschauen (steht nur in den Testberichten, nicht im Log).
          causes=$(find . -path '*test-results*' -name '*.xml' -exec grep -h -A25 '<failure' {} + 2>/dev/null \
            | grep -E 'failure message|Exception|Caused by|at com\.phasewake' | head -40 || true)
          if [ -n "$causes" ]; then
            echo "::error title=Vorschau-Fehler::$(printf '%s' "$causes" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"
          fi
      - name: In den Zweig «screenshots» legen
        shell: bash
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          for m in app wear; do
            mkdir -p "$out/$m"
            # Feste Dateinamen (ohne Prüfsummen-Anhang), damit Links im README stabil bleiben.
            find "android/$m/src/screenshotTestDebug/reference" -name '*.png' -print0 |
              while IFS= read -r -d '' f; do b=$(basename "$f"); cp "$f" "$out/$m/${b%%_*}.png"; done
          done
          sed "s/@SHA@/${GITHUB_SHA::7}/" .github/screenshots/README.md > "$out/README.md"
          cd "$out"
          git init -q -b screenshots
          git config user.name "r1AD"
          git config user.email "r1adBE@users.noreply.github.com"
          git add -A
          git commit -qm "Bildschirmfotos für ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots

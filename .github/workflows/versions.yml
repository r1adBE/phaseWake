name: Bibliotheksversionen

# Zeigt die neuesten stabilen Versionen der verwendeten Bibliotheken; manuell oder monatlich.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *"

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Versionen
        shell: bash
        run: |
          .github/scripts/latest-versions.sh | tee versions.txt
          # Als Hinweis, damit es ohne Log-Download über die Checks-API lesbar ist.
          echo "::notice title=Versionen::$(sed 's/%/%25/g' versions.txt | awk 'BEGIN{ORS="%0A"}{print}')"

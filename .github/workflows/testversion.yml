name: Testversion

# Baut Handy- und Uhr-App und legt sie als Vorabversion «test» auf GitHub ab:
# https://github.com/r1adBE/phaseWake/releases/tag/test
# Nur nach grüner CI für den Stand von main (genau der geprüfte Stand); von Hand nur auf main und nur, wenn die CI
# für diesen Stand grün gelaufen ist, als Push-Lauf (ein versehentlich gewählter Arbeitszweig bricht ab).
# Zwei Jobs (wie «Einschlafklänge»): «build» führt Gradle nur mit Leserecht und ohne
# gespeichertes Token aus, «publish» ersetzt die Vorabversion und führt keinen Code aus dem Repo aus.
# Startet nach jedem grünen Push-Lauf der CI, egal auf welchem Zweig, sobald dessen Commit der
# Stand von main ist (nach einem Fast-Forward läuft die CI auf main sonst nur kurz, siehe «Schon geprüft?» in ci.yml).
# Die APKs kommen aus jenem CI-Lauf (Build-Nummer = seine Laufnummer); nur ohne passende APKs wird neu gebaut.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    name: Stand und APKs bestimmen
    # Nur nach erfolgreichen Push-Läufen (keine Pull Requests, keine roten Läufe).
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.s.outputs.go }}
      sha: ${{ steps.s.outputs.sha }}
      build: ${{ steps.s.outputs.build }}
      ci_run: ${{ steps.s.outputs.ci_run }}
    steps:
      - name: Stand, Build-Nummer und CI-Lauf mit APKs
        id: s
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Der von der CI geprüfte Stand; von Hand der aktuelle.
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          TRIGGER_NUMBER: ${{ github.event.workflow_run.run_number || 0 }}
        run: |
          set -euo pipefail
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error title=Testversion::Von Hand nur auf main, nicht auf $GITHUB_REF"; exit 1
            fi
            green=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success&per_page=1" \
                      --jq '.total_count' || echo 0)
            if [ "${green:-0}" -lt 1 ]; then
              echo "::error title=Testversion::Für ${SHA::7} gibt es keinen grünen CI-Lauf"; exit 1
            fi
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            main=$(gh api "repos/$REPO/commits/main" --jq .sha)
            if [ "$main" != "$SHA" ]; then
              echo "::notice title=Testversion::${SHA::7} ist nicht der Stand von main (${main::7}): keine Testversion"
              echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          # Bisherige Testversion: Stand und Nummer («Testversion 341»). Die Build-Nummer muss steigen, sonst lässt
          # sich die neue nicht über die alte installieren.
          prev_sha=""; prev=0
          if info=$(gh api "repos/$REPO/releases/tags/test" --jq '.target_commitish + " " + .name' 2>/dev/null); then
            prev_sha=${info%% *}
            prev=$(printf '%s\n' "$info" | grep -oE '[0-9]+$' || echo 0)
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_run ] && [ "$prev_sha" = "$SHA" ]; then
            # Zweig und main sind für denselben Stand grün gelaufen: nur eine Testversion.
            echo "::notice title=Testversion::Für ${SHA::7} gibt es schon die Testversion $prev"
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Grüner Push-Lauf der CI für diesen Stand, dessen APKs noch da sind und dessen Nummer passt (höher als die
          # bisherige Testversion). Sonst wird neu gebaut.
          ci_run=""; build=0
          while read -r id number; do
            [ -n "$id" ] && [ "$number" -gt "$prev" ] || continue
            if gh api "repos/$REPO/actions/runs/$id/artifacts?name=testversion-apks" \
                 --jq '.artifacts[] | select(.expired | not) | .id' | grep -q .; then
              ci_run=$id; build=$number; break
            fi
          done < <(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success&per_page=20" \
                     --jq '.workflow_runs[] | "\(.id) \(.run_number)"')
          if [ -z "$ci_run" ]; then
            build=$(( TRIGGER_NUMBER > prev ? TRIGGER_NUMBER : prev + 1 ))
            echo "::notice title=Testversion::Keine passenden APKs der CI für ${SHA::7}: wird mit Nummer $build neu gebaut"
          else
            echo "::notice title=Testversion::APKs aus CI-Lauf $ci_run (Nummer $build) für ${SHA::7}"
          fi
          { echo "go=true"; echo "build=$build"; echo "ci_run=$ci_run"; } >> "$GITHUB_OUTPUT"

  build:
    needs: pruefen
    if: needs.pruefen.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Nur ein Build gleichzeitig; ein neuerer Stand bricht einen älteren ab.
    concurrency:
      group: testversion-build
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
    env:
      BUILD_SHA: ${{ needs.pruefen.outputs.sha }}
      BUILD_NUMBER: ${{ needs.pruefen.outputs.build }}
    steps:
      - name: APKs der CI holen
        id: ci
        if: needs.pruefen.outputs.ci_run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: testversion-apks
          path: dist
          run-id: ${{ needs.pruefen.outputs.ci_run }}
          github-token: ${{ github.token }}
      - name: Build-Nummer der APKs prüfen
        id: reuse
        shell: bash
        run: |
          set -euo pipefail
          got=$(cat dist/build-number.txt 2>/dev/null || true)
          if [ -n "${{ needs.pruefen.outputs.ci_run }}" ] && [ "$got" = "$BUILD_NUMBER" ] \
             && [ -s dist/PhaseWake-Handy.apk ] && [ -s dist/PhaseWake-Uhr.apk ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            [ -z "${{ needs.pruefen.outputs.ci_run }}" ] || echo "::warning title=Testversion::APKs der CI unvollständig oder Nummer «$got» statt $BUILD_NUMBER: wird neu gebaut"
            rm -rf dist
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.reuse.outputs.ok != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_SHA }}
          persist-credentials: false
      - if: steps.reuse.outputs.ok != 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - if: steps.reuse.outputs.ok != 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Bauen
        if: steps.reuse.outputs.ok != 'true'
        shell: bash
        working-directory: android
        env:
          PHASEWAKE_BUILD: ${{ env.BUILD_NUMBER }}
        run: |
          set -o pipefail
          ./gradlew --stacktrace :app:assembleDebug :wear:assembleDebug 2>&1 | tee build.log
      - name: Fehler als Annotation
        if: failure() && steps.reuse.outputs.ok != 'true'
        shell: bash
        working-directory: android
        run: ../.github/scripts/annotate-errors.sh build.log
      - name: APKs ablegen
        if: steps.reuse.outputs.ok != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/PhaseWake-Handy.apk
          cp android/wear/build/outputs/apk/debug/wear-debug.apk dist/PhaseWake-Uhr.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testversion
          path: |
            dist/PhaseWake-Handy.apk
            dist/PhaseWake-Uhr.apk
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Als Vorabversion «test» veröffentlichen
    needs: [pruefen, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Nacheinander: Löschen und neu Anlegen zweier Läufe dürfen sich nicht überschneiden.
    concurrency:
      group: testversion-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      BUILD_SHA: ${{ needs.pruefen.outputs.sha }}
      BUILD_NUMBER: ${{ needs.pruefen.outputs.build }}
    steps:
      # Kein Checkout: nur die APKs aus «build» und gh.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: testversion
          path: ${{ runner.temp }}/dist
      - name: Vorabversion ersetzen
        shell: bash
        working-directory: ${{ runner.temp }}/dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete test --cleanup-tag --yes || true
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/test" > /dev/null 2>&1 || true
          cat > notes.md <<NOTES
          Testversion ${BUILD_NUMBER} aus Stand \`${BUILD_SHA::7}\` – automatisch gebaut, nicht für den Alltag.

          - **PhaseWake-Handy.apk**: auf dem Android-Handy öffnen und installieren.
          - **PhaseWake-Uhr.apk**: auf die Galaxy Watch mit \`adb install -r PhaseWake-Uhr.apk\` (Anleitung: docs/TESTEN.md).

          Eigene Kennung (com.phasewake.app.test): installiert sich neben der Store-Version. Eine ältere Testversion einmal deinstallieren (vorher sichern).
          NOTES
          gh release create test PhaseWake-Handy.apk PhaseWake-Uhr.apk \
            --prerelease --target "$BUILD_SHA" \
            --title "Testversion ${BUILD_NUMBER}" --notes-file notes.md

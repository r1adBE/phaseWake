name: Testversion

# Baut Handy- und Uhr-App und legt sie als Vorabversion «test» auf GitHub ab:
# https://github.com/r1adBE/phaseWake/releases/tag/test
# Nur nach grüner CI auf main (genau der geprüfte Stand); von Hand jederzeit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: testversion
  cancel-in-progress: true

jobs:
  build:
    # Nur nach einem Push auf main mit erfolgreicher CI (keine Pull Requests, keine roten Läufe).
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      # Der von der CI geprüfte Stand; von Hand der aktuelle.
      BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.BUILD_SHA }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Bauen
        shell: bash
        working-directory: android
        env:
          PHASEWAKE_BUILD: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./gradlew --stacktrace :app:assembleDebug :wear:assembleDebug 2>&1 | tee build.log
      - name: Fehler als Annotation
        if: failure()
        shell: bash
        working-directory: android
        run: ../.github/scripts/annotate-errors.sh build.log
      - name: Als Vorabversion «test» veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk PhaseWake-Handy.apk
          cp android/wear/build/outputs/apk/debug/wear-debug.apk PhaseWake-Uhr.apk
          gh release delete test --cleanup-tag --yes || true
          git push origin :refs/tags/test || true
          cat > notes.md <<NOTES
          Testversion ${{ github.run_number }} aus Stand \`${BUILD_SHA::7}\` – automatisch gebaut, nicht für den Alltag.

          - **PhaseWake-Handy.apk**: auf dem Android-Handy öffnen und installieren.
          - **PhaseWake-Uhr.apk**: auf die Galaxy Watch mit \`adb install -r PhaseWake-Uhr.apk\` (Anleitung: docs/TESTEN.md).
          NOTES
          gh release create test PhaseWake-Handy.apk PhaseWake-Uhr.apk \
            --prerelease --target "$BUILD_SHA" \
            --title "Testversion ${{ github.run_number }}" --notes-file notes.md

name: Schrift holen

# Einmalig: lädt Manrope (SIL Open Font License) aus google/fonts und legt sie ins Repo.
on:
  push:
    branches: [main]
    paths: [.github/workflows/fetch-font.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Manrope laden
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/google/fonts/main/ofl/manrope
          mkdir -p android/shared/src/main/res/font ios/Resources/Fonts licenses
          curl -fsSL "$base/Manrope%5Bwght%5D.ttf" -o android/shared/src/main/res/font/manrope.ttf
          cp android/shared/src/main/res/font/manrope.ttf ios/Resources/Fonts/Manrope.ttf
          curl -fsSL "$base/OFL.txt" -o licenses/Manrope-OFL.txt
          sha256sum android/shared/src/main/res/font/manrope.ttf
      - name: Committen
        run: |
          git config user.name "r1AD"
          git config user.email "r1adBE@users.noreply.github.com"
          git rm -q .github/workflows/fetch-font.yml
          git add android/shared/src/main/res/font/manrope.ttf ios/Resources/Fonts/Manrope.ttf licenses/Manrope-OFL.txt
          git commit -m "Schrift Manrope (SIL Open Font License) hinzugefügt"
          git push

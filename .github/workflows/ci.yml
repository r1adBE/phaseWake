name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (Kern, Handy, Uhr)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Übersetzungen prüfen
        run: python3 ../.github/scripts/check-translations.py app/src/main/res wear/src/main/res
      - name: Tests und Builds
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --stacktrace :core:test :app:assembleDebug :wear:assembleDebug 2>&1 | tee build.log
      - name: Fehler als Annotation
        if: failure()
        shell: bash
        run: ../.github/scripts/annotate-errors.sh build.log
      - name: Testberichte
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: android-reports
          path: android/**/build/reports/

  apple-core:
    name: Apple-Kern (Swift)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios/PhaseWakeCore
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
      - name: Fehler als Annotation
        if: failure()
        shell: bash
        run: ../../.github/scripts/annotate-errors.sh test.log

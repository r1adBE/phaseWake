name: CI

on:
  push:
    # Arbeitszweige auch per Push: Die Regel für main zählt nur Prüfungen aus Push- oder PR-Läufen, nicht von Hand gestartete.
    branches: [main, "aenderung/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (Kern, Handy, Uhr)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Regeln (Dateigrösse, Build-Nummern, TODO)
        run: |
          python3 ../.github/scripts/line_limit.py --ci
          python3 ../.github/scripts/no_build_numbers.py --ci
          python3 ../.github/scripts/version_check.py
          python3 ../.github/scripts/doc_check.py --ci
      - name: Übersetzungen prüfen
        run: |
          python3 ../.github/scripts/check-translations.py app/src/main/res wear/src/main/res ../ios/Strings
          python3 ../.github/scripts/gen-xcstrings.py --check
      - name: Tests und Builds
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --stacktrace --continue :core:test :core:jacocoTestReport :shared:testDebugUnitTest :shared:createDebugUnitTestCoverageReport :app:testDebugUnitTest :app:createDebugUnitTestCoverageReport :wear:testDebugUnitTest :wear:createDebugUnitTestCoverageReport :app:assembleDebug :wear:assembleDebug :app:assembleRelease :wear:assembleRelease :app:lintDebug :wear:lintDebug 2>&1 | tee build.log
      - name: Store-Build prüfen
        run: python3 ../.github/scripts/release_check.py
      - name: Schwachstellen der Abhängigkeiten (OSV)
        run: python3 ../.github/scripts/osv_check.py
      - name: Abdeckung
        shell: bash
        run: |
          python3 ../.github/scripts/coverage_check.py "Kotlin-Kern" 90 core/build/reports/jacoco/test/jacocoTestReport.xml
          python3 ../.github/scripts/coverage_check.py "Android shared" 70 $(find shared/build/reports/coverage -name "*.xml" | head -1)
          # Handy und Uhr gesamt: nur zur Information (Review K-10). Wecken und Planen je Paket mit Mindestwert (Audit M-06).
          app_report=$(find app/build/reports/coverage -name "*.xml" | head -1)
          wear_report=$(find wear/build/reports/coverage -name "*.xml" | head -1)
          python3 ../.github/scripts/coverage_check.py "Android Handy" 0 "$app_report"
          python3 ../.github/scripts/coverage_check.py "Android Uhr" 0 "$wear_report"
          python3 ../.github/scripts/coverage_check.py "Handy Zweitwecker (ring)" 70 --package com/phasewake/app/ring "$app_report"
          python3 ../.github/scripts/coverage_check.py "Uhr Wecken (wake)" 70 --package com/phasewake/app/wear/wake "$wear_report"
          python3 ../.github/scripts/coverage_check.py "Uhr Planen (schedule)" 70 --package com/phasewake/app/wear/schedule "$wear_report"
      - name: Fehler als Annotation
        if: failure()
        shell: bash
        run: ../.github/scripts/annotate-errors.sh build.log
      - name: Warnungen (Übersicht)
        if: always()
        shell: bash
        run: |
          # Alle Lint- und Kotlin-Warnungen je Modul in einem Hinweis (auch wenn alles grün ist).
          set +e +o pipefail
          for f in */build/reports/lint-results-debug.txt; do
            [ -f "$f" ] || continue
            list=$(grep -E ": (Warning|Information):" "$f" | sed -E 's#^.*/android/##; s/: (Warning|Information): (.{0,180}).*\[([A-Za-z0-9]+).*$/ [\3] \2/')
            n=$(printf '%s\n' "$list" | grep -c .)
            echo "::notice title=Lint ${f%%/*} ($n)::$(printf '%s\n' "$list" | sed ':a;N;$!ba;s/\n/%0A/g')"
          done
          kw=$(grep -E "^w: " build.log | sed -E 's#file://[^ ]*/android/##' | sort -u)
          n=$(printf '%s\n' "$kw" | grep -c .)
          echo "::notice title=Kotlin-Warnungen ($n)::$(printf '%s\n' "$kw" | cut -c1-220 | sed ':a;N;$!ba;s/\n/%0A/g')"
          # XML-Parsermeldungen ohne Datei (Review K-05) mit der Gradle-Aufgabe davor, damit die Quelle sichtbar wird.
          xp=$(awk '/^> Task /{t=$3} /\[(Fatal Error|Error|Warning)\] *:|not allowed in prolog|Premature end of file|XML document structures/{print t " " $0}' build.log | sort -u)
          n=$(printf '%s\n' "$xp" | grep -c .)
          # Seit der Ursache (Watch-Face-Prüfungen auf res/raw, siehe wear/lint.xml) bricht eine solche Meldung den Lauf ab.
          [ "$n" -eq 0 ] || { echo "::error title=XML-Parsermeldungen ($n)::$(printf '%s\n' "$xp" | cut -c1-220 | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          exit 0
      - name: Lint-Befunde
        if: failure()
        shell: bash
        run: |
          for f in */build/reports/lint-results-debug.txt; do
            [ -f "$f" ] || continue
            grep -E ": (Error|Fatal):" "$f" | sed 's/^/::error::/' || true
          done
      - name: Testberichte
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: android/**/build/reports/

  apple-core:
    name: Apple-Kern (Swift)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios/PhaseWakeCore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift --version
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          swift test --enable-code-coverage 2>&1 | tee test.log
      - name: Abdeckung
        shell: bash
        run: python3 ../../.github/scripts/coverage_check.py "Swift-Kern" 90 "$(swift test --show-codecov-path)"
      - name: Warnungen (Übersicht)
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          w=$(grep -E "warning:" test.log | sed -E 's#^.*/ios/##' | sort -u)
          n=$(printf '%s\n' "$w" | grep -c .)
          echo "::notice title=Swift-Warnungen Kern ($n)::$(printf '%s\n' "$w" | cut -c1-220 | sed ':a;N;$!ba;s/\n/%0A/g')"
          exit 0
      - name: Fehler als Annotation
        if: failure()
        shell: bash
        run: ../../.github/scripts/annotate-errors.sh test.log

  apple-app:
    name: Apple-Apps (iPhone, Watch)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Neuestes Xcode wählen (keine Beta)
        shell: bash
        run: |
          set -o pipefail
          xcode=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|_rc|release.?candidate' | sort -V | tail -1)
          [ -n "$xcode" ] || { echo "::error title=Xcode::Kein Xcode ohne Beta gefunden"; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: SDK prüfen (AlarmKit braucht iOS 26)
        shell: bash
        run: |
          set -o pipefail
          # Gewähltes Xcode nochmals prüfen (auch wenn die Wahl oben geändert wird): keine Beta, kein Release Candidate.
          selected=$(xcode-select -p)
          if echo "$selected" | grep -qiE 'beta|_rc|release.?candidate'; then echo "::error title=Xcode::Beta-Xcode gewählt ($selected)"; exit 1; fi
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          if [[ ! "$sdk" =~ ^[0-9]+ ]] || [ "${sdk%%.*}" -lt 26 ]; then echo "::error title=SDK::iOS-SDK $sdk ohne AlarmKit (mindestens 26)"; exit 1; fi
          if [ ! -d "$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/Frameworks/AlarmKit.framework" ]; then
            echo "::error title=SDK::AlarmKit fehlt im iOS-SDK $sdk"; exit 1
          fi
          echo "iOS-SDK $sdk mit AlarmKit ($selected)"
      - name: iPhone-App (mit eingebetteter Watch-App) bauen
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project ios/PhaseWake.xcodeproj -scheme PhaseWake \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
      - name: Watch-App einzeln bauen
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project ios/PhaseWake.xcodeproj -scheme PhaseWakeWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build >> build.log 2>&1
      - name: Warnungen (Übersicht)
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          w=$(grep -E "warning:" build.log | grep -v "^ld: warning: ignoring duplicate" | sed -E 's#^.*/ios/##' | sort -u)
          n=$(printf '%s\n' "$w" | grep -c .)
          echo "::notice title=Xcode-Warnungen::$n Stück"
          printf '%s\n' "$w" | grep . | cut -c1-300 | head -9 | while read -r line; do echo "::notice title=Xcode-Warnung::$line"; done
          exit 0
      - name: Fehler als Annotation
        if: failure()
        shell: bash
        run: |
          grep -E "error:" build.log | sort -u > errors.log || true
          [ -s errors.log ] || tail -60 build.log > errors.log
          .github/scripts/annotate-errors.sh errors.log

name: CI

on:
  push:
    # Arbeitszweige auch per Push: Die Regel für main zählt nur Prüfungen aus Push- oder PR-Läufen, nicht von Hand gestartete.
    branches: [main, "aenderung/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nach einem Fast-Forward auf main ist der Stand meist schon auf seinem Arbeitszweig grün
  # gelaufen. Dann überspringt main die schweren Jobs (übersprungene Jobs gelten bei verlangten Prüfungen als
  # erfüllt), und die Testversion übernimmt die APKs jenes Laufs. Gezählt werden nur Push-Läufe: Sie prüfen genau
  # diesen Commit (ein PR-Lauf prüft den Merge mit main).
  # Ändert ein Pull Request nur android/** oder die Python-Anforderungen der Workflows (meist Dependabot), prüfen
  # die Apple-Jobs nichts Neues: «apple=false» überspringt sie (ebenfalls als erfüllt gewertet).
  vorab:
    name: Schon geprüft?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: read
    outputs:
      done: ${{ steps.check.outputs.done }}
      apple: ${{ steps.apple.outputs.apple }}
    steps:
      - name: Betrifft der Pull Request die Apple-Apps?
        id: apple
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          set -uo pipefail
          # Im Zweifel (kein PR, Abfrage gescheitert, keine Dateien) laufen die Apple-Jobs. Die Liste der API endet
          # bei 3000 Dateien: ab da laufen sie immer. Bei Umbenennungen zählt auch der alte Pfad.
          apple=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$PR" ] \
             && [[ "$CHANGED" =~ ^[0-9]+$ ]] && [ "$CHANGED" -lt 3000 ] \
             && files=$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" \
                          --jq '.[] | .filename, (.previous_filename // empty)') \
             && [ -n "$files" ] \
             && ! printf '%s\n' "$files" | grep -qvE '^(android/|\.github/scripts/[^/]*requirements[^/]*$)'; then
            apple=false
            echo "::notice title=CI::Nur Android oder Python-Anforderungen geändert: Apple-Jobs übersprungen"
          fi
          echo "apple=$apple" >> "$GITHUB_OUTPUT"
      - name: Grüner Lauf für diesen Commit?
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != push ] || [ "$GITHUB_REF" != refs/heads/main ]; then echo "done=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Kann die Abfrage nicht laufen, wird geprüft (nie still übersprungen).
          ok=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success&per_page=1" --jq '.total_count' || echo 0)
          if [ "${ok:-0}" -ge 1 ]; then
            echo "::notice title=CI::$SHA ist schon grün gelaufen (Arbeitszweig): Tests und Builds hier übersprungen"
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android (Kern, Handy, Uhr)
    needs: vorab
    if: needs.vorab.outputs.done != 'true'
    runs-on: ubuntu-latest
    # Ein hängender Build bricht ab statt den Lauf bis zu 6 Std. zu blockieren.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Regeln (Dateigrösse, Zeilenbreite, Funktionslänge, Parameter, Build-Nummern, TODO)
        run: |
          python3 -B -m unittest discover -s ../.github/scripts -p 'test_*.py'
          python3 ../.github/scripts/line_limit.py --ci
          python3 ../.github/scripts/code_limits.py --ci
          python3 ../.github/scripts/no_build_numbers.py --ci
          python3 ../.github/scripts/version_check.py
          python3 ../.github/scripts/doc_check.py --ci
      - name: Übersetzungen prüfen
        run: |
          python3 ../.github/scripts/check-translations.py app/src/main/res wear/src/main/res ../ios/Strings
          python3 ../.github/scripts/gen-xcstrings.py --check
      - name: Tests und Builds
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --stacktrace --continue :core:test :core:jacocoTestReport :shared:testDebugUnitTest :shared:createDebugUnitTestCoverageReport :app:testDebugUnitTest :app:createDebugUnitTestCoverageReport :wear:testDebugUnitTest :wear:createDebugUnitTestCoverageReport :app:assembleRelease :wear:assembleRelease :app:lintDebug :wear:lintDebug 2>&1 | tee build.log
      - name: Bildschirmfotos prüfen
        # Eigener Aufruf ohne parallele Tests und Lint: Im gemeinsamen Aufruf brach das Rendern der Handy-
        # Vorschauen auf dem Runner ab (ScreenshotRenderException bei allen 102 Bildern), allein läuft es durch.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --stacktrace --continue --no-parallel :app:validateDebugScreenshotTest :wear:validateDebugScreenshotTest 2>&1 | tee -a build.log
      # Nur bei Push: Nur dann werden die APKs abgelegt (unten).
      - name: Testversion-APKs bauen
        if: github.event_name == 'push'
        shell: bash
        env:
          # Build-Nummer wie in «Testversion» (übernimmt die APKs). Eigener Aufruf: Die Nummer steht im
          # Manifest, die Unit-Tests oben behalten so ihre Einträge im Build-Cache.
          PHASEWAKE_BUILD: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./gradlew --stacktrace :app:assembleDebug :wear:assembleDebug 2>&1 | tee -a build.log
      - name: Store-Build prüfen
        run: python3 ../.github/scripts/release_check.py
      # Dieselbe Positivliste für die Testversion (ohne Vorschau-Activity); ohne APKs nur das Manifest erzeugen.
      - name: Testversion prüfen
        shell: bash
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            ./gradlew --stacktrace :app:processDebugMainManifest :wear:processDebugMainManifest 2>&1 | tee -a build.log
          fi
          python3 ../.github/scripts/release_check.py --debug
      - name: Schwachstellen der Abhängigkeiten (OSV)
        run: python3 ../.github/scripts/osv_check.py
      - name: Abdeckung
        shell: bash
        run: |
          python3 ../.github/scripts/coverage_check.py "Kotlin-Kern" 90 core/build/reports/jacoco/test/jacocoTestReport.xml
          python3 ../.github/scripts/coverage_check.py "Android shared" 70 $(find shared/build/reports/coverage -name "*.xml" | head -1)
          # Handy und Uhr gesamt: nur zur Information. Wecken und Planen je Paket mit Mindestwert.
          app_report=$(find app/build/reports/coverage -name "*.xml" | head -1)
          wear_report=$(find wear/build/reports/coverage -name "*.xml" | head -1)
          python3 ../.github/scripts/coverage_check.py "Android Handy" 0 "$app_report"
          python3 ../.github/scripts/coverage_check.py "Android Uhr" 0 "$wear_report"
          python3 ../.github/scripts/coverage_check.py "Handy Zweitwecker (ring)" 70 --package com/phasewake/app/ring "$app_report"
          python3 ../.github/scripts/coverage_check.py "Uhr Wecken (wake)" 70 --package com/phasewake/app/wear/wake "$wear_report"
          python3 ../.github/scripts/coverage_check.py "Uhr Planen (schedule)" 70 --package com/phasewake/app/wear/schedule "$wear_report"
      # Nur Push-Läufe (keine Pull Requests) und nur, wenn bis hier alles grün ist; `testversion.yml` übernimmt sie.
      - name: Testversion-APKs ablegen
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/PhaseWake-Handy.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk ../dist/PhaseWake-Uhr.apk
          echo "${{ github.run_number }}" > ../dist/build-number.txt
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testversion-apks
          path: dist/
          retention-days: 3
          if-no-files-found: error
      - name: Fehler als Annotation
        if: failure()
        shell: bash
        run: ../.github/scripts/annotate-errors.sh build.log
      - name: Warnungen (Übersicht)
        if: always()
        shell: bash
        run: |
          # Alle Lint- und Kotlin-Warnungen je Modul in einem Hinweis (auch wenn alles grün ist).
          set +e +o pipefail
          for f in */build/reports/lint-results-debug.txt; do
            [ -f "$f" ] || continue
            list=$(grep -E ": (Warning|Information):" "$f" | sed -E 's#^.*/android/##; s/: (Warning|Information): (.{0,180}).*\[([A-Za-z0-9]+).*$/ [\3] \2/')
            n=$(printf '%s\n' "$list" | grep -c .)
            echo "::notice title=Lint ${f%%/*} ($n)::$(printf '%s\n' "$list" | sed ':a;N;$!ba;s/\n/%0A/g')"
          done
          kw=$(grep -E "^w: " build.log | sed -E 's#file://[^ ]*/android/##' | sort -u)
          n=$(printf '%s\n' "$kw" | grep -c .)
          echo "::notice title=Kotlin-Warnungen ($n)::$(printf '%s\n' "$kw" | cut -c1-220 | sed ':a;N;$!ba;s/\n/%0A/g')"
          # XML-Parsermeldungen ohne Datei mit der Gradle-Aufgabe davor, damit die Quelle sichtbar wird.
          xp=$(awk '/^> Task /{t=$3} /\[(Fatal Error|Error|Warning)\] *:|not allowed in prolog|Premature end of file|XML document structures/{print t " " $0}' build.log | sort -u)
          n=$(printf '%s\n' "$xp" | grep -c .)
          # Seit der Ursache (Watch-Face-Prüfungen auf res/raw, siehe wear/lint.xml) bricht eine solche Meldung den Lauf ab.
          [ "$n" -eq 0 ] || { echo "::error title=XML-Parsermeldungen ($n)::$(printf '%s\n' "$xp" | cut -c1-220 | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          exit 0
      - name: Lint-Befunde
        if: failure()
        shell: bash
        run: |
          for f in */build/reports/lint-results-debug.txt; do
            [ -f "$f" ] || continue
            grep -E ": (Error|Fatal):" "$f" | sed 's/^/::error::/' || true
          done
      - name: Testberichte
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          # Mit den Abweichungsbildern der Bildschirmfoto-Prüfung.
          path: |
            android/**/build/reports/
            android/**/build/outputs/screenshotTest-results/
            android/**/build/test-results/*Screenshot*/

  secrets:
    name: Geheimnisse (gitleaks)
    needs: vorab
    if: needs.vorab.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ganzer Verlauf: auch frühere Commits werden durchsucht.
          fetch-depth: 0
      - name: Geheimnisse suchen
        shell: bash
        env:
          # Fest gewählte Version; Prüfsumme des Go-Moduls (wie in go.sum), zusätzlich von sum.golang.org bestätigt.
          GITLEAKS_VERSION: v8.30.1
          GITLEAKS_SUM: "h1:PmEvCfVI7ti9dV3s5aMZUY7sS2GxRvG3yzih7E+cS3w="
        run: |
          set -euo pipefail
          module="github.com/zricethezav/gitleaks/v8@$GITLEAKS_VERSION"
          sum=$(go mod download -json "$module" | python3 -c 'import json, sys; print(json.load(sys.stdin)["Sum"])')
          if [ "$sum" != "$GITLEAKS_SUM" ]; then
            echo "::error title=gitleaks::Prüfsumme stimmt nicht ($sum)"
            exit 1
          fi
          GOBIN="$RUNNER_TEMP/bin" go install "$module"
          # Regeln und Ausnahmen (Testpasswörter): .gitleaks.toml
          "$RUNNER_TEMP/bin/gitleaks" git . --redact --no-banner --exit-code 1

  apple-core:
    name: Apple-Kern (Swift)
    needs: vorab
    if: needs.vorab.outputs.done != 'true' && needs.vorab.outputs.apple != 'false'
    runs-on: macos-latest
    # Wie die übrigen Jobs mit Frist.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios/PhaseWakeCore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift --version
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          swift test --enable-code-coverage 2>&1 | tee test.log
      - name: Abdeckung
        shell: bash
        run: python3 ../../.github/scripts/coverage_check.py "Swift-Kern" 90 "$(swift test --show-codecov-path)"
      - name: Warnungen (Übersicht)
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          # Läuft auf macOS (BSD-sed): Zeilen mit awk zu einem Hinweis verbinden.
          w=$(grep -E "warning:" test.log | sed -E 's#^.*/ios/##' | sort -u)
          n=$(printf '%s\n' "$w" | grep -c .)
          echo "::notice title=Swift-Warnungen Kern ($n)::$(printf '%s\n' "$w" | grep . | cut -c1-220 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"
          exit 0
      - name: Fehler als Annotation
        if: failure()
        shell: bash
        run: ../../.github/scripts/annotate-errors.sh test.log

  apple-app:
    name: Apple-Apps (iPhone, Watch)
    needs: vorab
    if: needs.vorab.outputs.done != 'true' && needs.vorab.outputs.apple != 'false'
    runs-on: macos-latest
    # Ein hängender Build bricht ab statt den Lauf bis zu 6 Std. zu blockieren.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Neuestes Xcode wählen (keine Beta)
        shell: bash
        run: |
          set -o pipefail
          xcode=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|_rc|release.?candidate' | sort -V | tail -1)
          [ -n "$xcode" ] || { echo "::error title=Xcode::Kein Xcode ohne Beta gefunden"; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: SDK prüfen (AlarmKit braucht iOS 26)
        shell: bash
        run: |
          set -o pipefail
          # Gewähltes Xcode nochmals prüfen (auch wenn die Wahl oben geändert wird): keine Beta, kein Release Candidate.
          selected=$(xcode-select -p)
          if echo "$selected" | grep -qiE 'beta|_rc|release.?candidate'; then echo "::error title=Xcode::Beta-Xcode gewählt ($selected)"; exit 1; fi
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          if [[ ! "$sdk" =~ ^[0-9]+ ]] || [ "${sdk%%.*}" -lt 26 ]; then echo "::error title=SDK::iOS-SDK $sdk ohne AlarmKit (mindestens 26)"; exit 1; fi
          if [ ! -d "$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/Frameworks/AlarmKit.framework" ]; then
            echo "::error title=SDK::AlarmKit fehlt im iOS-SDK $sdk"; exit 1
          fi
          echo "iOS-SDK $sdk mit AlarmKit ($selected)"
      - name: Simulatoren für die Tests wählen
        shell: bash
        run: |
          set -o pipefail
          # Neuester verfügbarer Simulator je Plattform (Namen und Versionen wechseln mit Xcode).
          cat > "$RUNNER_TEMP/sim.py" <<'PY'
          import json, re, sys
          platform, prefix = sys.argv[1], sys.argv[2]
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              match = re.search(r"SimRuntime\.%s-(\d+)-(\d+)" % platform, runtime)
              if not match:
                  continue
              version = (int(match.group(1)), int(match.group(2)))
              for device in devices:
                  if device.get("isAvailable", True) and device["name"].startswith(prefix) and (best is None or version > best[0]):
                      best = (version, device["udid"])
          print(best[1] if best else "")
          PY
          phone=$(xcrun simctl list devices available -j | python3 "$RUNNER_TEMP/sim.py" iOS iPhone)
          watch=$(xcrun simctl list devices available -j | python3 "$RUNNER_TEMP/sim.py" watchOS "Apple Watch")
          if [ -z "$phone" ] || [ -z "$watch" ]; then
            echo "::error title=Simulator::Kein iPhone- oder Apple-Watch-Simulator gefunden"
            xcrun simctl list devices available
            exit 1
          fi
          echo "PHONE_SIM=$phone" >> "$GITHUB_ENV"
          echo "WATCH_SIM=$watch" >> "$GITHUB_ENV"
      # Je Schema einmal für den gewählten Simulator bauen: das iPhone-Schema baut die eingebettete
      # Watch-App mit, das Watch-Schema die Watch-App einzeln. Die Tests laufen danach ohne neuen Build.
      - name: iPhone-App (mit eingebetteter Watch-App) bauen
        shell: bash
        run: |
          set -o pipefail
          # Mit Abdeckung: Schwelle für den iPhone-Zweitwecker nach den Tests.
          xcodebuild -project ios/PhaseWake.xcodeproj -scheme PhaseWake -destination "id=$PHONE_SIM" \
            -derivedDataPath build/DerivedData -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO build-for-testing > build.log 2>&1
      - name: Watch-App einzeln bauen
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project ios/PhaseWake.xcodeproj -scheme PhaseWakeWatch -destination "id=$WATCH_SIM" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build-for-testing >> build.log 2>&1
      # Unit-Tests der Apps, in der App als Testwirt: Lernphase, Export, Nacht-Check, Widget-Stand (iPhone);
      # Aufzeichnung, Erinnerung am Abend, Smart Alarm, Einschlafzeit (Uhr).
      - name: Tests iPhone-App
        shell: bash
        # Ein hängender Test bricht ab statt den Lauf stundenlang zu blockieren (ein Lauf hing schon über 78 Minuten).
        timeout-minutes: 30
        run: |
          set -o pipefail
          # Ergebnisbündel an festem Ort (bei Zeitüberschreitung mit Stack-Sample), im Fehlerfall hochgeladen.
          rm -rf build/phone.xcresult
          xcodebuild -project ios/PhaseWake.xcodeproj -scheme PhaseWake -destination "id=$PHONE_SIM" \
            -derivedDataPath build/DerivedData -resultBundlePath build/phone.xcresult -enableCodeCoverage YES \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 60 -maximum-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO test-without-building >> build.log 2>&1
          grep -E "Executed [0-9]+ tests?" build.log | tail -1 | sed 's/^/::notice title=Tests iPhone-App::/'
      - name: Abdeckung iPhone-Zweitwecker
        shell: bash
        run: |
          set -o pipefail
          # Je Datei eine Schwelle (Begründung: docs/ENTWICKLUNG.md, Abschnitt 4). Die Karte «Schlummern bis …» ist
          # Oberfläche und zählt nicht.
          xcrun xccov view --report --json build/phone.xcresult > build/phone-coverage.json
          python3 .github/scripts/xccov_check.py "iPhone-Zweitwecker" build/phone-coverage.json --exclude BackupSnoozeCard \
            ios/PhaseWake/BackupAlarm.swift=65 ios/PhaseWake/BackupAlarm+Reschedule.swift=65 \
            ios/PhaseWake/BackupAlarm+Plan.swift=50 ios/PhaseWake/BackupAlarm+Snooze.swift=80 \
            ios/PhaseWake/BackupAlarm+Transient.swift=80
      - name: Tests Watch-App
        shell: bash
        # Ein hängender Test bricht ab statt den Lauf stundenlang zu blockieren (ein Lauf hing schon über 78 Minuten).
        timeout-minutes: 30
        run: |
          set -o pipefail
          # Der Simulator meldete beim Start des Testwirts zeitweise «failed to launch … Unknown application display
          # identifier», ohne Fehler im Code. Darum die Watch-App vorher selbst installieren und nur bei genau dieser
          # Meldung einmal neu versuchen; jeder andere Fehler scheitert sofort.
          install_watch_app() {
            xcrun simctl bootstatus "$WATCH_SIM" -b > /dev/null || echo "::warning title=Tests Watch-App::Simulator startet nicht"
            local app id found=""
            for app in build/DerivedData/Build/Products/Debug-watchsimulator/*.app; do
              [ -f "$app/Info.plist" ] || continue
              id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist" 2> /dev/null || true)
              [ "$id" = com.phasewake.app.watchkitapp ] || continue
              found=$app
              xcrun simctl install "$WATCH_SIM" "$app" || echo "::warning title=Tests Watch-App::Vorinstallation gescheitert"
            done
            [ -n "$found" ] || echo "::warning title=Tests Watch-App::Watch-App für die Vorinstallation nicht gefunden"
          }
          run_watch_tests() {
            local rc=0
            rm -rf build/watch.xcresult
            xcodebuild -project ios/PhaseWake.xcodeproj -scheme PhaseWakeWatch -destination "id=$WATCH_SIM" \
              -derivedDataPath build/DerivedData -resultBundlePath build/watch.xcresult \
              -test-timeouts-enabled YES -default-test-execution-time-allowance 60 -maximum-test-execution-time-allowance 120 \
              CODE_SIGNING_ALLOWED=NO test-without-building > build/watch-test.log 2>&1 || rc=$?
            cat build/watch-test.log >> build.log
            return "$rc"
          }
          install_watch_app
          if ! run_watch_tests; then
            grep -qE 'Simulator device failed to launch|Unknown application display identifier' build/watch-test.log || exit 1
            echo "::warning title=Tests Watch-App::Simulator hat die Watch-App nicht gestartet: einmal neu versucht"
            install_watch_app
            run_watch_tests
          fi
          grep -E "Executed [0-9]+ tests?" build.log | tail -1 | sed 's/^/::notice title=Tests Watch-App::/'
      - name: Warnungen (Übersicht)
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          # Alle Warnungen von iPhone- und Watch-App in einem Hinweis: GitHub zeigt je Schritt höchstens 10 Hinweise,
          # eine Zeile je Warnung zeigte nur die ersten neun. Läuft auf macOS: awk statt GNU-sed.
          w=$(grep -E "warning:" build.log | grep -v "^ld: warning: ignoring duplicate" | sed -E 's#^.*/ios/##' | sort -u)
          n=$(printf '%s\n' "$w" | grep -c .)
          echo "::notice title=Xcode-Warnungen ($n)::$(printf '%s\n' "$w" | grep . | cut -c1-300 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"
          exit 0
      - name: Fehler als Annotation
        if: failure()
        shell: bash
        run: |
          grep -E "error:" build.log | sort -u > errors.log || true
          [ -s errors.log ] || tail -60 build.log > errors.log
          .github/scripts/annotate-errors.sh errors.log
      - name: Build-Protokoll
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-build-log
          # Dazu die Ergebnisbündel der Tests (bei Zeitüberschreitung mit Stack-Sample des hängenden Tests).
          path: |
            build.log
            build/phone.xcresult
            build/watch.xcresult

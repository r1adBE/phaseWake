name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (Kern, Handy, Uhr)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Übersetzungen prüfen
        run: |
          python3 ../.github/scripts/check-translations.py app/src/main/res wear/src/main/res ../ios/Strings
          python3 ../.github/scripts/gen-xcstrings.py --check
      - name: Tests und Builds
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --stacktrace --continue :core:test :app:assembleDebug :wear:assembleDebug :app:lintDebug :wear:lintDebug 2>&1 | tee build.log
      - name: Fehler als Annotation
        if: failure()
        shell: bash
        run: ../.github/scripts/annotate-errors.sh build.log
      - name: Warnungen (Übersicht)
        if: always()
        shell: bash
        run: |
          # Lint-Warnungen und Kotlin-Warnungen gezählt, als Hinweis sichtbar (auch wenn alles grün ist).
          for f in */build/reports/lint-results-debug.txt; do
            [ -f "$f" ] || continue
            body=$(grep -E ": Warning:|: Information:" "$f" | sed -E 's/.*\[([A-Za-z0-9]+).*$/\1/' | sort | uniq -c | sort -rn | awk '{printf "%s×%s; ", $1, $2}')
            echo "::notice title=Lint ${f%%/*}::${body:-keine}"
            grep -E ": Warning:" "$f" | head -40 | sed 's/^/::notice title=Lint-Warnung::/' || true
          done
          kw=$(grep -E "^w: " build.log | sed 's#file://[^ ]*/phaseWake/##' | sort -u)
          echo "::notice title=Kotlin-Warnungen::$(echo "$kw" | grep -c . ) Stück"
          echo "$kw" | head -30 | sed 's/^/::notice title=Kotlin-Warnung::/' || true
      - name: Lint-Befunde
        if: failure()
        shell: bash
        run: |
          for f in */build/reports/lint-results-debug.txt; do
            [ -f "$f" ] || continue
            grep -E ": (Error|Fatal):" "$f" | sed 's/^/::error::/' || true
          done
      - name: Testberichte
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: android-reports
          path: android/**/build/reports/

  apple-core:
    name: Apple-Kern (Swift)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios/PhaseWakeCore
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
      - name: Fehler als Annotation
        if: failure()
        shell: bash
        run: ../../.github/scripts/annotate-errors.sh test.log

  apple-app:
    name: Apple-Apps (iPhone, Watch)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Neuestes Xcode wählen
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: iPhone-App (mit eingebetteter Watch-App) bauen
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project ios/PhaseWake.xcodeproj -scheme PhaseWake \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
      - name: Watch-App einzeln bauen
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project ios/PhaseWake.xcodeproj -scheme PhaseWakeWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build >> build.log 2>&1
      - name: Fehler als Annotation
        if: failure()
        shell: bash
        run: |
          grep -E "error:" build.log | sort -u > errors.log || true
          [ -s errors.log ] || tail -60 build.log > errors.log
          .github/scripts/annotate-errors.sh errors.log

name: Store-Build

# Baut Handy- und Uhr-App als App Bundle (.aab) für Google Play, signiert mit dem Upload-Schlüssel.
# Nur von Hand und nur vom Stand auf main; Anleitung: docs/PLAY.md, Abschnitt «Store-Build».
on:
  workflow_dispatch:

permissions:
  contents: read
  # Prüfung, ob die CI für genau diesen Stand grün ist (Audit F-05).
  actions: read

concurrency:
  group: store
  cancel-in-progress: false

jobs:
  bundle:
    name: App Bundles (Handy, Uhr)
    runs-on: ubuntu-latest
    # Secrets des Upload-Schlüssels liegen in der GitHub-Umgebung «store» (nur main, docs/PLAY.md, Audit 5314d25 D-06).
    environment: store
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: CI für diesen Stand grün?
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Gebaut wird main; das muss genau der Stand sein, für den der Lauf gestartet wurde (sonst nicht geprüft).
          head=$(git rev-parse HEAD)
          if [ "$head" != "$SHA" ]; then
            echo "::error title=Store-Build::Ausgecheckt ist $head, gestartet für $SHA. Store-Build von main starten (und erst, wenn main sich nicht mehr ändert)."
            exit 1
          fi
          # Ein erfolgreich abgeschlossener Lauf des Workflows «CI» (ci.yml) für genau diesen Commit.
          ok=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=1" --jq '.total_count')
          if [ "${ok:-0}" -lt 1 ]; then
            echo "::error title=Store-Build::Kein erfolgreicher CI-Lauf für $SHA. Erst die CI für diesen Stand grün laufen lassen (Commits mit [skip ci] haben keinen)."
            exit 1
          fi
          echo "::notice title=Store-Build::CI für $SHA grün"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          # Vor dem Signieren noch einmal die Unit-Tests dieses Stands (wie in der CI).
          ./gradlew --stacktrace --continue :core:test :shared:testDebugUnitTest :app:testDebugUnitTest :wear:testDebugUnitTest 2>&1 | tee build.log
      - name: Secrets vorhanden?
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Nur prüfen, ob alles da ist (früh scheitern statt nach dem Build). Der Schlüssel wird erst beim
          # Signieren als Datei abgelegt (Audit 071597f DA-2).
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing PLAY_UPLOAD_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing PLAY_UPLOAD_STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing PLAY_UPLOAD_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing PLAY_UPLOAD_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Store-Build::Secrets fehlen:$missing (Settings → Secrets and variables → Actions, docs/PLAY.md)"
            exit 1
          fi
      - name: Regeln (Dateigrösse, Build-Nummern, Version)
        run: |
          python3 ../.github/scripts/line_limit.py --ci
          python3 ../.github/scripts/no_build_numbers.py --ci
          python3 ../.github/scripts/version_check.py
      - name: App Bundles bauen (unsigniert)
        shell: bash
        env:
          # Build-Nummer = Laufnummer dieses Workflows: steigt mit jedem Store-Build (Uhr: 1 000 000 dazu).
          PHASEWAKE_BUILD: ${{ github.run_number }}
        run: |
          set -o pipefail
          # Wie die CI: Release-Manifeste für release_check.py, dazu die Bundles. Ohne Schlüssel und Passwörter:
          # Gradle und alle Bibliotheken des Builds sehen weder die Secrets noch die Schlüsseldatei (Audit 5314d25
          # D-06, 071597f DA-2); signiert wird erst nach dem Beenden des Gradle-Daemons.
          ./gradlew --stacktrace :app:assembleRelease :wear:assembleRelease :app:bundleRelease :wear:bundleRelease 2>&1 | tee -a build.log
      - name: Store-Build prüfen
        run: python3 ../.github/scripts/release_check.py
      - name: Bundles signieren
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Erst den Gradle-Daemon (samt Plugins und Bibliotheken des Builds) beenden: er läuft sonst weiter und
          # könnte die Schlüsseldatei lesen, die erst jetzt entsteht (Audit 071597f DA-2).
          ./gradlew --stop
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          [ -s "$RUNNER_TEMP/upload.jks" ] || { echo "::error title=Store-Build::PLAY_UPLOAD_KEYSTORE_BASE64 ergibt keine Datei"; exit 1; }
          # Nur hier Schlüssel und Passwörter: jarsigner (JDK) signiert die Bundles wie Android Gradle (JAR-Signatur,
          # SHA-256).
          info=$(keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS")
          case "$info" in
            *"RSA key"*) sigalg=SHA256withRSA ;;
            *"-bit EC"*) sigalg=SHA256withECDSA ;;
            *) echo "::error title=Signieren::Schlüsselart des Upload-Schlüssels nicht erkannt (erwartet RSA)"; exit 1 ;;
          esac
          for module in app wear; do
            aab="$module/build/outputs/bundle/release/$module-release.aab"
            [ -f "$aab" ] || { echo "::error title=Signieren::$aab fehlt"; exit 1; }
            jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass:env STORE_PASSWORD -keypass:env KEY_PASSWORD \
              -digestalg SHA-256 -sigalg "$sigalg" "$aab" "$KEY_ALIAS" >/dev/null
          done
      - name: Signatur der Bundles prüfen
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          # Fingerabdruck des Upload-Schlüssels; jedes Bundle muss genau damit signiert sein. Ausgaben erst in Variablen,
          # dann prüfen (ein vorzeitig endendes grep in einer Pipe liesse sie mit pipefail scheitern).
          sha256() { awk '/^[[:space:]]*SHA256:/ { print $2; exit }' <<<"$1"; }
          expected=$(sha256 "$(keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS")")
          [ -n "$expected" ] || { echo "::error title=Signatur::Fingerabdruck des Upload-Schlüssels nicht lesbar"; exit 1; }
          mkdir -p "$RUNNER_TEMP/aab"
          for module in app wear; do
            aab="$module/build/outputs/bundle/release/$module-release.aab"
            [ -f "$aab" ] || { echo "::error title=Signatur::$aab fehlt"; exit 1; }
            out=$(jarsigner -verify -verbose "$aab" 2>&1 || true)
            if ! grep -q "^jar verified" <<<"$out"; then
              echo "::error title=Signatur::$module-release.aab ist nicht signiert"
              exit 1
            fi
            actual=$(sha256 "$(keytool -printcert -jarfile "$aab")")
            if [ "$actual" != "$expected" ]; then
              echo "::error title=Signatur::$module-release.aab ist nicht mit dem Upload-Schlüssel signiert"
              exit 1
            fi
            echo "::notice title=Signatur::$module-release.aab mit dem Upload-Schlüssel signiert"
          done
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/aab/PhaseWake-Handy-${{ github.run_number }}.aab"
          cp wear/build/outputs/bundle/release/wear-release.aab "$RUNNER_TEMP/aab/PhaseWake-Uhr-${{ github.run_number }}.aab"
      - name: Bundles ablegen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phasewake-store-${{ github.run_number }}
          path: ${{ runner.temp }}/aab/*.aab
          retention-days: 7
          if-no-files-found: error
      - name: Fehler als Annotation
        if: failure()
        shell: bash
        run: '[ -f build.log ] && ../.github/scripts/annotate-errors.sh build.log || true'
      - name: Upload-Schlüssel löschen
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/upload.jks"

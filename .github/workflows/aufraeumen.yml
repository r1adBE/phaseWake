name: Aufräumen

# Hält GitHub sauber (montags und von Hand):
# - Workflow-Läufe samt Artefakten und Protokollen: es bleiben der neuste Lauf je Workflow, alle Läufe für den aktuellen
#   Stand von main und der Testversion (Tag «test»; Testversion und Store-Build verlangen einen grünen CI-Lauf genau
#   dieses Commits) und laufende Läufe. Alles andere, das älter als 1 Tag ist, geht.
# - Artefakte, die zu keinem behaltenen Lauf gehören; CI-Caches, die 7 Tage nicht benutzt wurden.
# - Releases und Tags ausser «test».
# - Arbeitszweige, die vollständig in main stecken. Datenzweige der Workflows (feiertage, klaenge, screenshots) und main
#   bleiben immer. Von Hand zusätzlich: weitere Zweige zum Löschen angeben – nur, wenn sie in main stecken oder ihr
#   letzter Commit älter als 7 Tage ist (z. B. alte Zwischenstände); andere bleiben und werden gemeldet.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      branches:
        description: "Weitere Zweige zum Löschen (durch Leerzeichen getrennt)"
        required: false
        default: ""

permissions:
  actions: write
  contents: write

concurrency:
  group: aufraeumen
  cancel-in-progress: false

jobs:
  clean:
    name: Läufe und Zweige
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Geschützte Stände (main, Tag «test»)
        shell: bash
        run: |
          set -euo pipefail
          # Leer, wenn es den Tag nicht gibt; dann schützt der Vergleich nichts zusätzlich.
          echo "KEEP_MAIN=$(git rev-parse --verify origin/main)" >> "$GITHUB_ENV"
          echo "KEEP_TEST=$(git rev-parse --verify -q 'refs/tags/test^{commit}' || true)" >> "$GITHUB_ENV"
      - name: Alte Läufe löschen (samt Artefakten und Protokollen)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          # Neuste zuerst: der erste Lauf je Workflow bleibt, ebenso Läufe für main/«test», laufende und dieser hier.
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            -q '.workflow_runs[] | [.id, .workflow_id, .head_sha, .status, .created_at] | @tsv' > runs.tsv
          : > keep.txt; : > gone.txt; seen=" "
          while IFS=$'\t' read -r id wf sha status created; do
            if [ "$id" = "$SELF" ] || [ "$status" != completed ] || [ "$sha" = "$KEEP_MAIN" ] || [ "$sha" = "$KEEP_TEST" ]; then
              echo "$id" >> keep.txt
            elif [ "${seen#* "$wf" }" = "$seen" ]; then
              echo "$id" >> keep.txt
            elif [[ "$created" < "$cutoff" ]]; then
              echo "$id" >> gone.txt
            else
              echo "$id" >> keep.txt
            fi
            # Nur abgeschlossene Läufe zählen als «neuster je Workflow».
            [ "$status" = completed ] && case "$seen" in *" $wf "*) ;; *) seen="$seen$wf " ;; esac || true
          done < runs.tsv
          n=0
          while read -r id; do
            gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null 2>&1 && n=$((n + 1)) || true
          done < gone.txt
          echo "::notice title=Aufräumen::$n Läufe gelöscht, $(wc -l < keep.txt) bleiben"
      - name: Verwaiste Artefakte und alte Caches löschen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          n=0
          while IFS=$'\t' read -r id run; do
            grep -qx "$run" keep.txt && continue
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" >/dev/null 2>&1 && n=$((n + 1)) || true
          done < <(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" -q '.artifacts[] | [.id, .workflow_run.id] | @tsv')
          cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          c=0
          while IFS=$'\t' read -r id used; do
            [[ "$used" < "$cutoff" ]] || continue
            gh api -X DELETE "repos/$REPO/actions/caches/$id" >/dev/null 2>&1 && c=$((c + 1)) || true
          done < <(gh api --paginate "repos/$REPO/actions/caches?per_page=100" -q '.actions_caches[] | [.id, .last_accessed_at] | @tsv')
          echo "::notice title=Aufräumen::$n Artefakte ohne behaltenen Lauf und $c Caches (7 Tage unbenutzt) gelöscht"
      - name: Releases und Tags ausser «test» löschen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          n=0
          while IFS=$'\t' read -r id tag; do
            [ "$tag" = test ] && continue
            gh api -X DELETE "repos/$REPO/releases/$id" >/dev/null && n=$((n + 1))
          done < <(gh api --paginate "repos/$REPO/releases" -q '.[] | [.id, .tag_name] | @tsv')
          for tag in $(gh api --paginate "repos/$REPO/tags" -q '.[].name'); do
            [ "$tag" = test ] && continue
            gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" >/dev/null && n=$((n + 1))
          done
          echo "::notice title=Aufräumen::$n Releases/Tags gelöscht (nur «test» bleibt)"
      - name: Erledigte Arbeitszweige löschen
        shell: bash
        env:
          EXTRA: ${{ inputs.branches }}
        run: |
          set -euo pipefail
          keep=" main feiertage klaenge screenshots "
          gone=""
          for ref in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin); do
            [ "$ref" = "HEAD" ] && continue
            case "$keep" in *" $ref "*) continue ;; esac
            # Nur Zweige, deren Stand vollständig in main steckt (zusammengeführt); Dependabot-Zweige gehören zu offenen PRs.
            case "$ref" in dependabot/*) continue ;; esac
            if git merge-base --is-ancestor "origin/$ref" origin/main; then gone="$gone $ref"; fi
          done
          for ref in $EXTRA; do
            case "$keep" in *" $ref "*) echo "::warning title=Aufräumen::$ref bleibt (geschützt)"; continue ;; esac
            git show-ref --verify --quiet "refs/remotes/origin/$ref" || { echo "::warning title=Aufräumen::$ref gibt es nicht"; continue; }
            # Von Hand nur, was in main steckt oder seit über 7 Tagen ruht: Ein vertippter Name löscht keinen offenen Arbeitszweig.
            last=$(git log -1 --format=%ct "origin/$ref")
            if ! git merge-base --is-ancestor "origin/$ref" origin/main && [ "$last" -gt "$(date -u -d '7 days ago' +%s)" ]; then
              echo "::warning title=Aufräumen::$ref bleibt (nicht in main, letzter Commit jünger als 7 Tage)"
              continue
            fi
            gone="$gone $ref"
          done
          for ref in $(printf '%s\n' $gone | sort -u); do
            git push origin --delete "$ref" && echo "::notice title=Aufräumen::Zweig $ref gelöscht"
          done
          [ -n "$gone" ] || echo "::notice title=Aufräumen::Keine Zweige zu löschen"

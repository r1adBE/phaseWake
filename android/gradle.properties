# Mehr Speicher für Gradle und D8: Mit AGP 9.5 lief das Zusammenführen der Dex-Dateien mit 2 GB in der CI aus dem Speicher.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
# Bildschirmfotos aus @Preview (offizielles Werkzeug von Google, nur für Tests).
android.experimental.enableScreenshotTest=true
# Version der App (Handy, Uhr, iPhone, Apple Watch) – einzige Quelle; die Build-Nummer kommt aus der CI.
phasewake.version=16.2.2
